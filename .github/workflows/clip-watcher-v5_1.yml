name: Clip Watcher V5.1 (rolling live clips)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Twitch channel"
        required: true
        default: "xqc"
        type: string
      minutes:
        description: "Live recording duration (3-5 minutes)"
        required: true
        default: "4"
        type: string
      validate_only:
        description: "Run offline V5.1 validation only; do not connect to Twitch"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install clipping dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlink faster-whisper numpy opencv-python-headless==4.10.0.84

      - name: Install FFmpeg (validated BtbN static build, apt fallback)
        run: |
          set -e
          mkdir -p "$HOME/ff"
          ARCHIVE="/tmp/ffmpeg-master-latest-linux64-gpl.tar.xz"
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          STATIC_OK=0
          if curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 "$URL" -o "$ARCHIVE" \
             && [ "$(stat -c%s "$ARCHIVE" 2>/dev/null || echo 0)" -gt 50000000 ] \
             && xz -t "$ARCHIVE"; then
            if tar -xJf "$ARCHIVE" --strip-components=2 -C "$HOME/ff" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' \
               && [ -x "$HOME/ff/ffmpeg" ] && [ -x "$HOME/ff/ffprobe" ]; then
              STATIC_OK=1
            fi
          fi
          if [ "$STATIC_OK" -ne 1 ]; then
            echo "Static FFmpeg failed validation; falling back to Ubuntu package."
            sudo apt-get install -y --no-install-recommends ffmpeg
            echo "/usr/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/ff" >> "$GITHUB_PATH"
          fi

      - name: Verify FFmpeg
        run: |
          set -e
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate V5.1 syntax and offline render
        run: |
          set -euo pipefail
          python -m py_compile clip_watcher_v5_1.py
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -u clip_watcher_v5_1.py --validate-only 2>&1 | tee validate.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-1-validation-log
          path: validate.log
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7

      - name: Validate inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'[A-Za-z0-9_]+', os.environ['CHANNEL']), 'Invalid Twitch channel'
          assert 3 <= int(os.environ['MINUTES']) <= 5, 'Duration must be 3-5 minutes'
          PY

      - name: Run rolling-buffer watcher and render
        if: inputs.validate_only != true
        env:
          CHANNEL: ${{ inputs.channel }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          mkdir -p clips
          set -o pipefail
          python -u clip_watcher_v5_1.py "$CHANNEL" --max-minutes "$MINUTES" --max-clips 3 --out clips --no-effects 2>&1 | tee clips/watcher.log

      - name: Upload clip 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-1
          path: clips/clip-1_score*.mp4
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload clip 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-2
          path: clips/clip-2_score*.mp4
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload clip 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-3
          path: clips/clip-3_score*.mp4
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload summary and watcher log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-summary-and-log
          path: |
            clips/summary.json
            clips/watcher.log
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7

      - name: Validate output and clean temporary source files
        if: always()
        run: |
          set -e
          COUNT=$(find clips -maxdepth 1 -type f -name 'clip-*.mp4' | wc -l)
          echo "Finished clip count: $COUNT"
          if [ "${{ job.status }}" = "success" ] && [ "$COUNT" -lt 1 ]; then
            echo "::error::No clips were rendered"
            exit 1
          fi
          rm -rf clips/buffer clips/proxy-list.txt
          rm -f clips/*.ts clips/*.src.mp4 clips/*.ass
