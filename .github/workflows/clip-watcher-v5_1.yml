name: Clip Watcher V5.1 (live split test)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Twitch channel to record"
        required: true
        default: "xqc"
        type: string
      minutes:
        description: "Live recording duration (3-5 minutes)"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install clipping dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlink faster-whisper numpy opencv-python-headless

      - name: Install FFmpeg (validated BtbN static build, apt fallback)
        run: |
          set -e
          mkdir -p "$HOME/ff"
          ARCHIVE="/tmp/ffmpeg-master-latest-linux64-gpl.tar.xz"
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          STATIC_OK=0
          if curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 "$URL" -o "$ARCHIVE" \
             && [ "$(stat -c%s "$ARCHIVE" 2>/dev/null || echo 0)" -gt 50000000 ] \
             && xz -t "$ARCHIVE"; then
            if tar -xJf "$ARCHIVE" --strip-components=2 -C "$HOME/ff" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' \
               && [ -x "$HOME/ff/ffmpeg" ] && [ -x "$HOME/ff/ffprobe" ]; then
              STATIC_OK=1
            fi
          fi
          if [ "$STATIC_OK" -ne 1 ]; then
            echo "Static FFmpeg failed validation; falling back to Ubuntu package."
            sudo apt-get install -y --no-install-recommends ffmpeg
            echo "/usr/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/ff" >> "$GITHUB_PATH"
          fi

      - name: Verify FFmpeg
        run: |
          set -e
          echo "Architecture: $(uname -m)"
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'[A-Za-z0-9_]+', os.environ['CHANNEL']), 'Invalid Twitch channel'
          assert 3 <= int(os.environ['MINUTES']) <= 5, 'Duration must be 3-5 minutes'
          PY

      - name: Watch stream and render clips
        env:
          CHANNEL: ${{ inputs.channel }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          mkdir -p clips
          set -o pipefail
          python -u clip_watcher_v5_1.py "$CHANNEL" --max-minutes "$MINUTES" --layout split --pre 12 --post 8 --max-clips 3 --out clips --no-effects 2>&1 | tee clips/watcher.log

      - name: Validate recording and clips
        if: always()
        run: |
          set -e
          REC="clips/_recording_${{ inputs.channel }}.ts"
          test -s "$REC" || { echo "::error::No recording file was created"; exit 1; }
          COUNT=$(find clips -maxdepth 1 -type f -name 'clip_*.mp4' | wc -l)
          echo "Clip count: $COUNT"
          test "$COUNT" -ge 1 || { echo "::error::No clips were created"; exit 1; }

      - name: Upload V5.1 logs, raw recording and clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-v5-1-${{ inputs.channel }}-${{ github.run_number }}
          path: |
            clips/watcher.log
            clips/streamlink.log
            clips/_recording_*.ts
            clips/clip_*.mp4
            clips/index.csv
          if-no-files-found: warn
          retention-days: 7
