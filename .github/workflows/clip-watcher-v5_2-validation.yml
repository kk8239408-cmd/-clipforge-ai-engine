name: ClipForge V5.2 Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless==4.10.0.84

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Compile V5.2
        run: python -m py_compile clip_watcher_v5_2.py

      - name: Run offline V5.2 validation
        run: |
          set -o pipefail
          python -u clip_watcher_v5_2.py --validate-only 2>&1 | tee v5-2-validation.log

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-2-validation-results
          path: |
            v5-2-validation.log
            validate-output/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
