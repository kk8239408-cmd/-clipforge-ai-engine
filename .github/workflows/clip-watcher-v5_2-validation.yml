name: ClipForge V5.2 Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless==4.10.0.84

      - name: Restore cached static FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/clipforge-ffmpeg
          key: clipforge-ffmpeg-static-linux-x64-v1

      - name: Download FFmpeg only on cache miss
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/clipforge-ffmpeg"
          curl -fsSL --retry 3 --connect-timeout 15 \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \\
            -o /tmp/clipforge-ffmpeg.tar.xz
          tar -xJf /tmp/clipforge-ffmpeg.tar.xz -C /tmp
          ffdir="$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' -print -quit)"
          test -n "$ffdir"
          install -m 0755 "$ffdir/ffmpeg" "$HOME/.cache/clipforge-ffmpeg/ffmpeg"
          install -m 0755 "$ffdir/ffprobe" "$HOME/.cache/clipforge-ffmpeg/ffprobe"

      - name: Add cached FFmpeg to PATH and verify
        run: |
          echo "$HOME/.cache/clipforge-ffmpeg" >> "$GITHUB_PATH"
          "$HOME/.cache/clipforge-ffmpeg/ffmpeg" -version | head -n 1
          "$HOME/.cache/clipforge-ffmpeg/ffprobe" -version | head -n 1

      - name: Compile V5.2
        run: python -m py_compile clip_watcher_v5_2.py

      - name: Run offline V5.2 validation
        run: |
          set -o pipefail
          python -u clip_watcher_v5_2.py --validate-only 2>&1 | tee v5-2-validation.log

      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-2-validation-results
          path: |
            v5-2-validation.log
            validate-output/render-no-face.mp4
            validate-output/render-face.mp4
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
