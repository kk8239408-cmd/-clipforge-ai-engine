name: ClipForge YouTube AI Clipper

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL (only videos you have permission to edit)"
        required: true
        type: string
      max_clips:
        description: "Maximum quality clips"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp
      - name: Install FFmpeg (fast static build)
        run: |
          set -e
          mkdir -p "$HOME/ff"
          ARCHIVE="/tmp/ffmpeg-master-latest-linux64-gpl.tar.xz"
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          STATIC_OK=0
          START=$SECONDS
          if curl -fL --retry 3 --retry-delay 1 --connect-timeout 15 "$URL" -o "$ARCHIVE" \
             && [ "$(stat -c%s "$ARCHIVE" 2>/dev/null || echo 0)" -gt 50000000 ] \
             && xz -t "$ARCHIVE"; then
            if tar -xJf "$ARCHIVE" --strip-components=2 -C "$HOME/ff" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' \
               && [ -x "$HOME/ff/ffmpeg" ] && [ -x "$HOME/ff/ffprobe" ]; then STATIC_OK=1; fi
          fi
          if [ "$STATIC_OK" -eq 1 ]; then
            echo "$HOME/ff" >> "$GITHUB_PATH"
          else
            echo "Static FFmpeg invalid/unavailable; apt fallback."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
            echo "/usr/bin" >> "$GITHUB_PATH"
          fi
          echo "FFMPEG_INSTALL_SECONDS=$((SECONDS-START))"
      - name: Verify tools and Gemini key
        env:
          AI_KEY: ${{ secrets.CLIPFORGE_VISION_API_KEY }}
        run: |
          set -e
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          test -n "$AI_KEY" || (echo "Add CLIPFORGE_VISION_API_KEY in GitHub Actions secrets." && exit 1)
      - name: Run YouTube AI clipper
        env:
          CLIPFORGE_VISION_API_KEY: ${{ secrets.CLIPFORGE_VISION_API_KEY }}
          CLIPFORGE_VISION_MODEL: gemini-2.5-flash
        run: |
          mkdir -p youtube-clips
          python -u clip_youtube_v1.py --url "${{ inputs.youtube_url }}" --max-clips "${{ inputs.max_clips }}" --out youtube-clips 2>&1 | tee youtube-clips/run.log
      - name: Upload only selected clips and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-youtube-selected-clips
          path: |
            youtube-clips/clip-*.mp4
            youtube-clips/summary.json
            youtube-clips/run.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
