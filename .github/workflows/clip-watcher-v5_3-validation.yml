name: ClipForge V5.3 Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clip-watcher-v5_3-validation.yml'
      - 'clip_watcher_v5_3.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless==4.10.0.84
      - name: Install FFmpeg (validated BtbN static build, apt fallback)
        run: |
          set -e
          mkdir -p "$HOME/ff"
          ARCHIVE="/tmp/ffmpeg-master-latest-linux64-gpl.tar.xz"
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          STATIC_OK=0
          if curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 "$URL" -o "$ARCHIVE" \
             && [ "$(stat -c%s "$ARCHIVE" 2>/dev/null || echo 0)" -gt 50000000 ] \
             && xz -t "$ARCHIVE"; then
            if tar -xJf "$ARCHIVE" --strip-components=2 -C "$HOME/ff" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' \
               && [ -x "$HOME/ff/ffmpeg" ] && [ -x "$HOME/ff/ffprobe" ]; then
              STATIC_OK=1
            fi
          fi
          if [ "$STATIC_OK" -ne 1 ]; then
            echo "Static FFmpeg failed validation; falling back to Ubuntu package."
            sudo apt-get install -y --no-install-recommends ffmpeg
            echo "/usr/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/ff" >> "$GITHUB_PATH"
          fi
      - name: Verify FFmpeg
        run: |
          set -e
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Compile V5.3
        run: python -m py_compile clip_watcher_v5_3.py
      - name: Run offline V5.3 validation
        run: |
          set -o pipefail
          python -u clip_watcher_v5_3.py --validate-only 2>&1 | tee v5-3-validation.log
      - name: Upload validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-3-validation-results
          path: |
            v5-3-validation.log
            validate-output/render-no-face.mp4
            validate-output/render-face.mp4
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
